name: Build MED TIMING 1.8.9

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-22.04

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Set up Java 8
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '8'

  - name: Extract project
    run: unzip -o MED-TIMING-1.8.9-source.zip

  - name: Prepare Forge workspace
    working-directory: med_timing
    run: ./gradlew setupDecompWorkspace --no-daemon
